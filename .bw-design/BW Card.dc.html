<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/arox-fitness-design-system-84b1f47b-d8b1-4d6f-a27a-eda04f8a6336/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/arox-fitness-design-system-84b1f47b-d8b1-4d6f-a27a-eda04f8a6336/tokens/colors.css">
  <link rel="stylesheet" href="_ds/arox-fitness-design-system-84b1f47b-d8b1-4d6f-a27a-eda04f8a6336/tokens/typography.css">
  <link rel="stylesheet" href="_ds/arox-fitness-design-system-84b1f47b-d8b1-4d6f-a27a-eda04f8a6336/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/arox-fitness-design-system-84b1f47b-d8b1-4d6f-a27a-eda04f8a6336/tokens/base.css">
  <link rel="stylesheet" href="_ds/arox-fitness-design-system-84b1f47b-d8b1-4d6f-a27a-eda04f8a6336/styles.css">
  <script src="_ds/arox-fitness-design-system-84b1f47b-d8b1-4d6f-a27a-eda04f8a6336/_ds_bundle.js"></script>
</helmet>
<div style="font-family:var(--font-sans);background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%;color:#111">
  <div style="position:relative;aspect-ratio:1/1;background:#111;overflow:hidden">
    <sc-if value="{{ isCover }}" hint-placeholder-val="{{ true }}"><img src="{{ img }}" alt="{{ title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ pos }}"></sc-if>
    <sc-if value="{{ isInset }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:14%;border-radius:8px;overflow:hidden"><img src="{{ img }}" alt="{{ title }}" style="width:100%;height:100%;object-fit:cover;display:block"></div></sc-if>
    <sc-if value="{{ isLogo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;text-align:center"><img src="uploads/drive_brand_arox-r-white.png" alt="Arox" style="width:52%;display:block;margin:0 auto"><div style="color:#9b9b9b;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">{{ logoLine }}</div></div></sc-if>
    <div style="position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap">
      <x-import component-from-global-scope="AroxFitnessDesignSystem_84b1f4.Badge" variant="sale" hint-size="auto,22px">{{ badge }}</x-import>
      <sc-if value="{{ hasBadge2 }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="AroxFitnessDesignSystem_84b1f4.Badge" variant="soft" hint-size="auto,22px">{{ badge2 }}</x-import></sc-if>
    </div>
  </div>
  <div style="padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1">
    <div style="font-size:15px;font-weight:500;line-height:1.3;text-wrap:pretty">{{ title }}</div>
    <sc-if value="{{ hasPrice }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="AroxFitnessDesignSystem_84b1f4.Price" price="{{ price }}" show-label="{{ true }}" size="sm" hint-size="auto,20px"></x-import></sc-if>
    <sc-if value="{{ hasNormal }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;color:#3a3a3a">Normalpris {{ normal }}</div></sc-if>
    <sc-if value="{{ hasUnit }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;color:#3a3a3a">{{ unit }}</div></sc-if>
    <sc-if value="{{ hasMech }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;line-height:1.4;color:#3a3a3a">{{ mech }}</div></sc-if>
    <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#111">{{ note }}</div></sc-if>
    <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ false }}"><div style="margin-top:auto;padding-top:8px"><x-import component-from-global-scope="AroxFitnessDesignSystem_84b1f4.Button" size="sm" full-width="{{ true }}" hint-size="100%,36px">Læg i kurv</x-import></div></sc-if>
    <sc-if value="{{ hasLink }}" hint-placeholder-val="{{ false }}"><div style="margin-top:auto;padding-top:8px"><x-import component-from-global-scope="AroxFitnessDesignSystem_84b1f4.Button" variant="secondary" size="sm" full-width="{{ true }}" hint-size="100%,36px">Se varen</x-import></div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;240px&quot;,&quot;height&quot;:&quot;440px&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/shopify_draft_limited-blackout-anti-slip-grips.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Limited blackout anti slip grips&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cover&quot;,&quot;inset&quot;,&quot;logo&quot;],&quot;default&quot;:&quot;inset&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Single offer&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;199 kr.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;normal&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;329 kr.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showNormal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mech&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kun i Black Week&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;50% 50%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logoLine&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mode = p.mode ?? 'cover';
    return {
      img: p.img ?? '', title: p.title ?? '', badge: p.badge ?? '', badge2: p.badge2 ?? '',
      pos: p.pos ?? '50% 50%', price: p.price ?? '', normal: p.normal ?? '', unit: p.unit ?? '',
      mech: p.mech ?? '', note: p.note ?? '', logoLine: p.logoLine ?? '',
      isCover: mode === 'cover', isInset: mode === 'inset', isLogo: mode === 'logo',
      hasBadge2: !!p.badge2, hasPrice: !!p.price, hasNormal: !!p.normal && (p.showNormal ?? true),
      hasUnit: !!p.unit, hasMech: !!p.mech, hasNote: !!p.note,
      hasCta: !!p.price && (p.cta ?? true), hasLink: !p.price && (p.cta ?? true),
    };
  }
}
</script>
</body>
</html>
